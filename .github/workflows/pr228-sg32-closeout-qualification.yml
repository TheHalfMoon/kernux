          echo "MACOS_DESKTOP_TESTS_79_PASS"
      - name: Diffcipline R2
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R2
