name: PR203 Jev Exact-Head Review

on:
  push:
    branches:
      - probe/pr203-jev-exact-head
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: a9f697c933c583133fd02e575a801531991c2b2c
  TARGET_SHA: 27736f76d68745151fb19c761838eaf90538e576

jobs:
  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify exact head and credential presence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test -n "${TYPESAFE_API_KEY:-}" || { echo "TYPESAFE_API_KEY_UNAVAILABLE"; exit 3; }
          echo "TYPESAFE_API_KEY_AVAILABLE"
      - name: Install genuine Jev CLI 0.3.2
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @jtsang/jev-cli@0.3.2
          jev-cli --version
      - name: Run exact-head Jev review
        shell: bash
        run: |
          set -euo pipefail
          git diff --unified=100 "$BASE_SHA...$TARGET_SHA" -- crates/kernux-policy/src/egress.rs > /tmp/state.diff
          cat > /tmp/questions.json <<'JSON'
          {
            "authority_widening": {
              "type": "boolean",
              "instructions": "Does this exact diff create, mint, widen, or bypass authority instead of only constraining an exact already-eligible Grant/request binding?"
            },
            "permissive_unknown": {
              "type": "boolean",
              "instructions": "Does this exact diff permit unknown or incomplete egress metadata, including sensitivity, to pass instead of failing closed?"
            },
            "class_substitution": {
              "type": "boolean",
              "instructions": "Does this exact diff permit one egress class to substitute for another, including DIRECT_DESTINATION for EXTERNAL_MODEL or CONNECTED_ACCOUNT for EXTERNAL_TOOL?"
            },
            "destination_confusion": {
              "type": "boolean",
              "instructions": "Does this exact diff permit a host/account/runtime destination to differ from the trusted egress constraint, the canonical Grant/request resource binding, or applicable effective network-host constraints?"
            },
            "operation_bypass": {
              "type": "boolean",
              "instructions": "Does this exact diff permit an egress operation that differs from the operation bound by the canonical Grant/request match or trusted egress constraint?"
            },
            "sensitive_data_bypass": {
              "type": "boolean",
              "instructions": "Does this exact diff permit sensitive or unknown-sensitivity egress without explicit trusted sensitive-data allowance?"
            },
            "provider_or_io_coupling": {
              "type": "boolean",
              "instructions": "Does this exact diff add provider-specific execution, network I/O, side effects, persistence, or silent cloud fallback to the pure policy layer?"
            },
            "forbidden_scope_drift": {
              "type": "boolean",
              "instructions": "Does this exact diff modify or semantically widen secrets, KRP, daemon/store behavior, manifests/lockfiles, ledgers, or P02-exit claims beyond SG-000029 PR-B?"
            }
          }
          JSON
          jev-cli eval             --provider jev             --model jev-1.13.0             --state-file /tmp/state.diff             --questions-file /tmp/questions.json             --compact > /tmp/jev.json
          cat /tmp/jev.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/jev.json','utf8'));
          const ids=[
            'authority_widening','permissive_unknown','class_substitution',
            'destination_confusion','operation_bypass','sensitive_data_bypass',
            'provider_or_io_coupling','forbidden_scope_drift'
          ];
          for(const id of ids){
            const a=data[id];
            if(!a || a.type!=='boolean' || typeof a.probability!=='number'){
              console.error('JEV_RESULT_MISSING_OR_INVALID',id);
              process.exit(2);
            }
            console.log('JEV_DIMENSION',id,'P_TRUE',a.probability);
            if(a.probability>=0.5){
              console.error('JEV_BLOCKING_TRUE',id,a.probability);
              process.exit(1);
            }
          }
          console.log('JEV_8_OF_8_NO');
          NODE
