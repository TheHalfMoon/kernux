name: SG33 Proof Writer 20260926

on:
  push:
    branches:
      - probe/sg33-native-qualification-20260926

permissions:
  contents: write

env:
  CLOSEOUT_SHA: 457a307b28fa95a7e4e757289995048ff7193b10
  CLOSEOUT_PR: '240'
  CLOSEOUT_EXACT_CI: '36243245499'
  CLOSEOUT_POST_CI: '36243482441'
  NATIVE_RUN: '36239099789'
  DRY_RUN: '36243087264'
  PACKET_CI: '36004049157'
  PACKET_POST_CI: '36004385573'
  EXPECTED_RESULT_DIGEST: sha256:4ee50d787e326d7c238075cdf1ffd405c7a0822585c661030897993498a989e5

jobs:
  write-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/sg33-proof
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout proof writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: probe/sg33-native-qualification-20260926
          path: writer
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Generate and validate proof
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          python3 tools/specgrain/run.py check
          python3 ../writer/tools/probe/sg33_proof_writer.py
          cat /tmp/sg33-proof-meta.json
          pnpm run specgrain:check
          pnpm run test:ui-system
          pnpm run check:workspace
          pnpm run check:protocol
          pnpm run typecheck
          pnpm run format:check
          pnpm run lint
          python3 tools/specgrain/run.py prove SG-000033
          git diff --check
          git status --porcelain --untracked-files=all
          test "$(git status --porcelain --untracked-files=all | wc -l)" -eq 4

      - name: Commit and push proof candidate
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kernux Proof Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .specgrain/evidence/SG-000033 docs/evidence/P03-S02-T01.md specs/CURRENT.md specs/tasks.md
          git commit -m "docs: prove KX-P03-S02-T01"
          git push origin HEAD:codex/sg33-proof
          echo "PROOF_HEAD=$(git rev-parse HEAD)"
