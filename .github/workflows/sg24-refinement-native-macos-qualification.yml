name: SG24 Refinement Native macOS Qualification

on:
  push:
    branches:
      - probe/sg24-refinement-qualification

permissions:
  contents: read

env:
  BASE_SHA: 94e0691c82ad17e8639b4e19391a518014590a49
  TARGET_SHA: cac39f6c40c7fbdc41e19dfb27a4939fadc91c5f
  EXPECTED_BLOB: 9c7a858f2028ee7401f69e74551032ad0713f875

jobs:
  exact-target-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact refinement target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact bounded refinement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object .specgrain/specs/SG-000024.json)" = "$EXPECTED_BLOB"
          test "$(git diff --name-only "$BASE_SHA...$TARGET_SHA")" = ".specgrain/specs/SG-000024.json"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          sw_vers
          uname -m

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full repository baseline
        run: pnpm check

      - name: Prove refinement at Diffcipline R3
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R3
          run-verification: "true"

      - name: Install pinned Alibaba OpenCodeReview
        run: npm install --global @alibaba-group/open-code-review@1.12.7

      - name: Run OpenCodeReview Delegation Mode preview
        shell: bash
        run: |
          set -euo pipefail
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"

      - name: Final exact-target cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git hash-object .specgrain/specs/SG-000024.json)" = "$EXPECTED_BLOB"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
