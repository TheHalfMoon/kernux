name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace contract
        run: pnpm check:workspace

      - name: Check JavaScript and TypeScript
        run: pnpm check:js

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

  specgrain:
    name: SpecGrain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Python baseline
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Validate SpecGrain runner
        run: python3 -m py_compile tools/specgrain/run.py

      - name: Check pinned SpecGrain state
        run: |
          python3 tools/specgrain/run.py --show-pin
          python3 tools/specgrain/run.py check .

  diffcipline:
    name: Diffcipline R1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove pull request at R1
        if: ${{ github.event_name == 'pull_request' }}
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96 # v1.0.0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          risk: R1
          run-verification: "true"

      - name: Prove main push at R1
        if: ${{ github.event_name == 'push' }}
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96 # v1.0.0
        with:
          base: ${{ github.event.before }}
          risk: R1
          run-verification: "true"

  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Python baseline
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Compile provenance tooling
        run: python3 -m py_compile tools/provenance/validate.py tools/provenance/test_validate.py

      - name: Run provenance conformance suite
        run: python3 -m unittest tools.provenance.test_validate -v

      - name: Validate tracked donor ledger
        run: python3 tools/provenance/validate.py check
