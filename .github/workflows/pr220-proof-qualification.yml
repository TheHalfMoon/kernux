name: PR220 Proof Qualification

on:
  push:
    branches:
      - probe/pr220-proof-qualification

permissions:
  contents: read

env:
  BASE_SHA: f51f04c3b369d7839aab56eae27efef704f1a638
  TARGET_SHA: a2aa19e42293a2a602205a276389c717ac17d070
  PIN_COMMIT: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
  PIN_ARCHIVE_SHA256: da6a8c006c3a0154e76e2bf08bcae58bb86e04f06dd7a03115275b466489eef9
  WORKPACKET_SHA256: e70b0737c525f3d258d03ceb7f4734a7815d28fedd9e45cf76966c438d1ce3fb
  RECORD_DIGEST: sha256:2860e1a9ab8e0595ea57cbbd6e45ff480e9f926be8dfc75ba6d7f7e489244dbe

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact proof surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA...$TARGET_SHA" > /tmp/paths.txt
          cat /tmp/paths.txt
          test 4 -eq $(wc -l < /tmp/paths.txt)
          grep -q ".specgrain/evidence/SG-000031/2860e1a9ab8e0595ea57cbbd6e45ff480e9f926be8dfc75ba6d7f7e489244dbe.json" /tmp/paths.txt
          grep -q "docs/evidence/P03-S01-T01.md" /tmp/paths.txt
          grep -q "specs/CURRENT.md" /tmp/paths.txt
          grep -q "specs/tasks.md" /tmp/paths.txt
          git diff --shortstat "$BASE_SHA...$TARGET_SHA" > /tmp/counts.txt
          cat /tmp/counts.txt
          grep -q "4 files changed" /tmp/counts.txt
          grep -q "264 insertions" /tmp/counts.txt
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- apps/ crates/ protocol/)"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- Cargo.lock Cargo.toml pnpm-lock.yaml package.json)"
          grep -q "KX-P03-S01-T01 is now PROVEN" specs/CURRENT.md
          grep -q "KX-P03-S01-T01 closeout: PROVEN" specs/tasks.md
          grep -q "Native SG-000031 verification - PROVEN" docs/evidence/P03-S01-T01.md
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify native proof record and replay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/specgrain/run.py --show-pin | grep -q "$PIN_COMMIT"
          python3 tools/specgrain/run.py check .
          python3 tools/specgrain/run.py prove SG-000031 . --json > /tmp/sg31-prove.json
          grep -q 'verified.:true' /tmp/sg31-prove.json
          grep -q 'record_count.:1' /tmp/sg31-prove.json
          grep -q '2860e1a9ab8e0595ea57cbbd6e45ff480e9f926be8dfc75ba6d7f7e489244dbe' /tmp/sg31-prove.json
          python3 tools/specgrain/run.py prove SG-000030 . --json > /tmp/sg30-prove.json
          grep -q 'verified.:true' /tmp/sg30-prove.json
          python3 tools/specgrain/run.py packet SG-000031 . --context-sources docs/evidence/SG-000031-context-sources.json --json > /tmp/SG-000031-replay.json
          cmp docs/evidence/SG-000031-work-packet.json /tmp/SG-000031-replay.json
          echo "REPLAY_CMP_PASS"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Full baseline
        run: pnpm check
      - name: Desktop shell tests
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --project apps/desktop/test/tsconfig.tests.json --outDir /tmp/shell-pf-out
          node --test "/tmp/shell-pf-out/test/*.test.js"
      - name: Diffcipline R3
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R3
          run-verification: "true"
      - name: Alibaba OpenCodeReview 1.12.7 accounting
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.12.7
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"
      - name: Final cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

  macos:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native macOS proof surface and record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --name-only "$BASE_SHA...$TARGET_SHA" > /tmp/paths.txt
          test 4 -eq $(wc -l < /tmp/paths.txt)
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- apps/ crates/ protocol/)"
          python3 tools/specgrain/run.py check .
          python3 tools/specgrain/run.py prove SG-000031 . --json > /tmp/sg31-prove.json
          grep -q 'verified.:true' /tmp/sg31-prove.json
          grep -q '2860e1a9ab8e0595ea57cbbd6e45ff480e9f926be8dfc75ba6d7f7e489244dbe' /tmp/sg31-prove.json
          python3 tools/specgrain/run.py packet SG-000031 . --context-sources docs/evidence/SG-000031-context-sources.json --json > /tmp/SG-000031-replay.json
          cmp docs/evidence/SG-000031-work-packet.json /tmp/SG-000031-replay.json
          echo "MACOS_REPLAY_CMP_PASS"
          sw_vers
          uname -m
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Desktop shell tests
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --project apps/desktop/test/tsconfig.tests.json --outDir /tmp/shell-pf-out
          node --test "/tmp/shell-pf-out/test/*.test.js"
      - name: Diffcipline R3
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R3
          run-verification: "true"
      - name: Alibaba OpenCodeReview 1.12.7 accounting
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.12.7
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"
      - name: Final cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
