name: PR229 SG32 Proof Qualification

on:
  push:
    branches:
      - probe/pr229-sg32-proof

permissions:
  contents: read

env:
  BASE_SHA: f8b92dadb290fdda3e7bdf2c7aeea8f7fd0aa3b7
  TARGET_SHA: 46c94bae9b0f0e55ac9beda762bc797ef988527e
  PIN_COMMIT: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
  PACKET_DIGEST: sha256:a8f29a55050ca0ec14a13e539daeb3784f8bfb4c49058fefee50f2ce0969c9dc

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact proof surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA...$TARGET_SHA" > /tmp/paths.txt
          cat /tmp/paths.txt
          test 4 -eq $(wc -l < /tmp/paths.txt)
          grep -qx ".specgrain/evidence/SG-000032/d30b9692e0a991ef63e6b5416d3180602a14d0df9ca79095d3fa87f8a11bd7b1.json" /tmp/paths.txt
          grep -qx "docs/evidence/P03-S01-T02.md" /tmp/paths.txt
          grep -qx "specs/CURRENT.md" /tmp/paths.txt
          grep -qx "specs/tasks.md" /tmp/paths.txt
          git diff --shortstat "$BASE_SHA...$TARGET_SHA" | grep -q "4 files changed"
          git diff --shortstat "$BASE_SHA...$TARGET_SHA" | grep -q "314 insertions"
          test "$(git diff --numstat "$BASE_SHA...$TARGET_SHA" | awk '{s+=$1; d+=$2} END {print s}')" = "314"
          test "$(git diff --numstat "$BASE_SHA...$TARGET_SHA" | awk '{s+=$1; d+=$2} END {print d}')" = "4"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- Cargo.lock Cargo.toml pnpm-lock.yaml package.json pnpm-workspace.yaml)"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- crates/ protocol/ apps/ docs/canonical/)"
          grep -q "Native SG-000032 verification - PROVEN" docs/evidence/P03-S01-T02.md
          grep -q "KX-P03-S01-T02 is PROVEN" specs/tasks.md
          grep -q "KX-P03-S01-T02 QUALIFICATION" specs/CURRENT.md
          test -f .specgrain/evidence/SG-000032/d30b9692e0a991ef63e6b5416d3180602a14d0df9ca79095d3fa87f8a11bd7b1.json
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify SpecGrain state and byte-identical replay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/specgrain/run.py --show-pin | grep -q "$PIN_COMMIT"
          python3 tools/specgrain/run.py check .
          python3 tools/specgrain/run.py prove SG-000032 . --json > /tmp/sg32-prove.json
          grep -q 'verified.:true' /tmp/sg32-prove.json
          grep -q 'record_count.:1' /tmp/sg32-prove.json
          grep -q 'd30b9692e0a991ef63e6b5416d3180602a14d0df9ca79095d3fa87f8a11bd7b1' /tmp/sg32-prove.json
          python3 tools/specgrain/run.py prove SG-000031 . --json > /tmp/sg31-prove.json
          grep -q 'verified.:true' /tmp/sg31-prove.json
          python3 -c "import json; d=json.load(open('docs/evidence/SG-000032-work-packet.json')); assert d['packet_digest']=='$PACKET_DIGEST'"
          python3 tools/specgrain/run.py packet SG-000032 . --context-sources docs/evidence/SG-000032-context-sources.json --json > /tmp/SG-000032-replay.json
          cmp docs/evidence/SG-000032-work-packet.json /tmp/SG-000032-replay.json
          echo "PROOF_REPLAY_CMP_PASS"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Full baseline
        run: pnpm check
      - name: Desktop shell tests
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --project apps/desktop/test/tsconfig.tests.json --outDir /tmp/sg32-out
          node --test "/tmp/sg32-out/test/*.test.js" 2>&1 | tee /tmp/desktop-tests.log
          grep -q "pass 79" /tmp/desktop-tests.log
          grep -q "fail 0" /tmp/desktop-tests.log
          echo "PROOF_DESKTOP_TESTS_79_PASS"
      - name: Diffcipline R2
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R2
          run-verification: "true"
      - name: Alibaba OpenCodeReview 1.12.7 accounting
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.12.7
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"
      - name: Final cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
