name: PR207 Proof Qualification

on:
  push:
    branches:
      - probe/pr207-proof-qualification

permissions:
  contents: read

env:
  BASE_SHA: cc426e9dee6d5322ff73c8ef27834a8f01195955
  TARGET_SHA: 1217943a216506722da4d10bdecbac21873c559a
  PIN_COMMIT: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
  PIN_ARCHIVE_SHA256: da6a8c006c3a0154e76e2bf08bcae58bb86e04f06dd7a03115275b466489eef9
  SPEC_REVISION: sha256:8680129138f08eb434e729a28136d3d6902881eaee91929c92e60b97c61d9bc8
  CONTEXT_PLAN_DIGEST: sha256:6b1328622e66ca24c8022587c4892f703bbfd470c30e4c66cec279728cdbc560
  PACKET_DIGEST: sha256:fedbd524f487e3acbd7defc979dfd32a28be1217ac74b47d6d47a762892137ca
  WORKPACKET_SHA256: 3699d36ea9a30ebdfd75e2c0b9ca05107811b1692076132da9fb5d4571adba37
  RECORD_DIGEST: sha256:2273a0e1264a35a9300e715e17f102c42523d7dd373d539c9a427fb4b7c02e8b

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact proof surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA...$TARGET_SHA" > /tmp/paths.txt
          cat /tmp/paths.txt
          test 4 -eq $(wc -l < /tmp/paths.txt)
          grep -q ".specgrain/evidence/SG-000029/2273a0e1264a35a9300e715e17f102c42523d7dd373d539c9a427fb4b7c02e8b.json" /tmp/paths.txt
          grep -q "docs/evidence/P02-S07-T01.md" /tmp/paths.txt
          grep -q "specs/CURRENT.md" /tmp/paths.txt
          grep -q "specs/tasks.md" /tmp/paths.txt
          git diff --shortstat "$BASE_SHA...$TARGET_SHA" > /tmp/counts.txt
          cat /tmp/counts.txt
          grep -q "4 files changed" /tmp/counts.txt
          grep -q "273 insertions" /tmp/counts.txt
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- crates/ protocol/)"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- Cargo.lock Cargo.toml pnpm-lock.yaml)"
          grep -q "KX-P02-S07-T01 is now PROVEN" specs/CURRENT.md
          grep -q "P02 has 10 / 10 macro tasks PROVEN" specs/CURRENT.md
          grep -q "KX-P02-S07-T01 closeout: PROVEN" specs/tasks.md
          grep -q "Native SG-000029 verification - PROVEN" docs/evidence/P02-S07-T01.md
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify native proof record and replay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/specgrain/run.py --show-pin | grep -q "$PIN_COMMIT"
          python3 tools/specgrain/run.py check .
          python3 tools/specgrain/run.py prove SG-000029 . --json > /tmp/sg29-prove.json
          cat /tmp/sg29-prove.json | head -c 600
          grep -q '"verified": true' /tmp/sg29-prove.json || grep -q 'verified.:true' /tmp/sg29-prove.json
          grep -q '"record_count": 1' /tmp/sg29-prove.json || grep -q 'record_count.:1' /tmp/sg29-prove.json
          grep -q '2273a0e1264a35a9300e715e17f102c42523d7dd373d539c9a427fb4b7c02e8b' /tmp/sg29-prove.json
          python3 -c "import json,hashlib; d=open('.specgrain/evidence/SG-000029/2273a0e1264a35a9300e715e17f102c42523d7dd373d539c9a427fb4b7c02e8b.json','rb').read(); print(len(d)); assert hashlib.sha256(d).hexdigest()=='6488759ae7196feee19f4829306ec74d76011be2be2567c81856837377d65291'"
          python3 tools/specgrain/run.py prove SG-000028 . --json > /tmp/sg28-prove.json
          grep -q 'verified.:true' /tmp/sg28-prove.json
          python3 tools/specgrain/run.py packet SG-000029 . --context-sources docs/evidence/SG-000029-context-sources.json --json > /tmp/SG-000029-replay.json
          cmp docs/evidence/SG-000029-work-packet.json /tmp/SG-000029-replay.json
          echo "REPLAY_CMP_PASS"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Full baseline
        run: pnpm check
      - name: Focused regressions
        run: cargo test -p kernux-policy -p kernux-secret -p kernux-store -p kernuxd -p kernux-identity --all-targets
      - name: Diffcipline R3
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R3
          run-verification: "true"
      - name: Alibaba OpenCodeReview 1.12.7 accounting
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.12.7
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"
      - name: Final cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

  macos:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native macOS proof surface and record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --name-only "$BASE_SHA...$TARGET_SHA" > /tmp/paths.txt
          test 4 -eq $(wc -l < /tmp/paths.txt)
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- crates/ protocol/)"
          python3 tools/specgrain/run.py check .
          python3 tools/specgrain/run.py prove SG-000029 . --json > /tmp/sg29-prove.json
          grep -q 'verified.:true' /tmp/sg29-prove.json
          grep -q '2273a0e1264a35a9300e715e17f102c42523d7dd373d539c9a427fb4b7c02e8b' /tmp/sg29-prove.json
          python3 tools/specgrain/run.py packet SG-000029 . --context-sources docs/evidence/SG-000029-context-sources.json --json > /tmp/SG-000029-replay.json
          cmp docs/evidence/SG-000029-work-packet.json /tmp/SG-000029-replay.json
          echo "MACOS_REPLAY_CMP_PASS"
          sw_vers
          uname -m
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p kernux-policy --all-targets
          cargo test -p kernux-secret -p kernux-store -p kernuxd -p kernux-identity --all-targets
      - name: Diffcipline R3
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R3
          run-verification: "true"
      - name: Alibaba OpenCodeReview 1.12.7 accounting
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.12.7
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"
      - name: Final cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
