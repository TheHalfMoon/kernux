name: PR203 Egress-B Qualification

on:
  push:
    branches:
      - probe/pr203-egress-b-qualification

permissions:
  contents: read

env:
  BASE_SHA: a9f697c933c583133fd02e575a801531991c2b2c
  TARGET_SHA: 01e6e3def76d7019c9f023942ba689f555ee8c3b
  PIN_COMMIT: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
  PIN_ARCHIVE_SHA256: da6a8c006c3a0154e76e2bf08bcae58bb86e04f06dd7a03115275b466489eef9
  SPEC_REVISION: sha256:8680129138f08eb434e729a28136d3d6902881eaee91929c92e60b97c61d9bc8
  CONTEXT_PLAN_DIGEST: sha256:6b1328622e66ca24c8022587c4892f703bbfd470c30e4c66cec279728cdbc560
  PACKET_DIGEST: sha256:fedbd524f487e3acbd7defc979dfd32a28be1217ac74b47d6d47a762892137ca
  WORKPACKET_SHA256: 3699d36ea9a30ebdfd75e2c0b9ca05107811b1692076132da9fb5d4571adba37
  WORKPACKET_BYTES: "10141"
  CONTEXT_BYTES: "7206"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR-B surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA...$TARGET_SHA" > /tmp/paths.txt
          cat /tmp/paths.txt
          test "$(cat /tmp/paths.txt)" = "crates/kernux-policy/src/egress.rs"
          git diff --shortstat "$BASE_SHA...$TARGET_SHA"
          test "$(git diff --numstat "$BASE_SHA...$TARGET_SHA" | awk '{s+=$1} END {print s+0}')" = "367"
          test "$(git diff --numstat "$BASE_SHA...$TARGET_SHA" | awk '{s+=$2} END {print s+0}')" = "6"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- Cargo.lock Cargo.toml pnpm-lock.yaml)"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- protocol/)"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- specs/ docs/ .specgrain/)"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify SpecGrain state and byte-identical replay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/specgrain/run.py --show-pin | grep -q "$PIN_COMMIT"
          python3 tools/specgrain/run.py --show-pin | grep -q "$PIN_ARCHIVE_SHA256"
          python3 tools/specgrain/run.py check .
          python3 tools/specgrain/run.py prove SG-000029 . --json > /tmp/sg29-prove.json || test $? -eq 1
          cat /tmp/sg29-prove.json
          grep -q 'verified.:false' /tmp/sg29-prove.json
          grep -q 'record_count.:0' /tmp/sg29-prove.json
          python3 tools/specgrain/run.py prove SG-000028 . --json > /tmp/sg28-prove.json
          grep -q 'verified.:true' /tmp/sg28-prove.json
          test "$(stat -c%s docs/evidence/SG-000029-work-packet.json)" = "$WORKPACKET_BYTES"
          test "$(stat -c%s docs/evidence/SG-000029-context-sources.json)" = "$CONTEXT_BYTES"
          echo "$WORKPACKET_SHA256  docs/evidence/SG-000029-work-packet.json" | sha256sum -c -
          python3 -c "import json; d=json.load(open('docs/evidence/SG-000029-work-packet.json')); assert d['packet_digest']=='$PACKET_DIGEST'; assert d['spec_revision']=='$SPEC_REVISION'; assert d['context_plan_digest']=='$CONTEXT_PLAN_DIGEST'; assert d['spec_id']=='SG-000029'"
          python3 tools/specgrain/run.py packet SG-000029 . --context-sources docs/evidence/SG-000029-context-sources.json --json > /tmp/SG-000029-replay.json
          cmp docs/evidence/SG-000029-work-packet.json /tmp/SG-000029-replay.json
          echo "REPLAY_CMP_PASS"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Full baseline
        run: pnpm check
      - name: Focused policy regression
        run: cargo test -p kernux-policy --all-targets
      - name: Secret store daemon regression
        run: cargo test -p kernux-secret -p kernux-store -p kernuxd -p kernux-identity --all-targets
      - name: Diffcipline R3
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R3
          run-verification: "true"
      - name: Alibaba OpenCodeReview 1.12.7 accounting
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.12.7
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"
      - name: Final cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

  macos:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native macOS exact surface and replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA...$TARGET_SHA" > /tmp/paths.txt
          cat /tmp/paths.txt
          test "$(cat /tmp/paths.txt)" = "crates/kernux-policy/src/egress.rs"
          test "$(git diff --numstat "$BASE_SHA...$TARGET_SHA" | awk '{s+=$1} END {print s+0}')" = "367"
          test "$(git diff --numstat "$BASE_SHA...$TARGET_SHA" | awk '{s+=$2} END {print s+0}')" = "6"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- Cargo.lock Cargo.toml pnpm-lock.yaml)"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- protocol/)"
          test -z "$(git diff --name-only "$BASE_SHA...$TARGET_SHA" -- specs/ docs/ .specgrain/)"
          echo "$WORKPACKET_SHA256  docs/evidence/SG-000029-work-packet.json" | shasum -a 256 -c -
          python3 tools/specgrain/run.py --show-pin | grep -q "$PIN_COMMIT"
          python3 tools/specgrain/run.py check .
          python3 tools/specgrain/run.py prove SG-000029 . --json > /tmp/sg29-prove.json || test $? -eq 1
          python3 tools/specgrain/run.py prove SG-000028 . --json > /tmp/sg28-prove.json
          python3 tools/specgrain/run.py packet SG-000029 . --context-sources docs/evidence/SG-000029-context-sources.json --json > /tmp/SG-000029-replay.json
          cmp docs/evidence/SG-000029-work-packet.json /tmp/SG-000029-replay.json
          echo "MACOS_REPLAY_CMP_PASS"
          sw_vers
          uname -m
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Focused policy secret store daemon regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p kernux-policy --all-targets
          cargo test -p kernux-secret -p kernux-store -p kernuxd -p kernux-identity --all-targets
      - name: Diffcipline R3
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R3
          run-verification: "true"
      - name: Alibaba OpenCodeReview 1.12.7 accounting
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.12.7
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"
      - name: Final cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"


  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify Jev credential availability without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TYPESAFE_API_KEY:-}" || { echo "TYPESAFE_API_KEY_UNAVAILABLE"; exit 3; }
          echo "TYPESAFE_API_KEY_AVAILABLE"
      - name: Install genuine Jev CLI 0.3.2
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @jtsang/jev-cli@0.3.2
          jev-cli --version
      - name: Review exact PR-B diff with Jev 1.13.0
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --unified=80 "$BASE_SHA...$TARGET_SHA" -- crates/kernux-policy/src/egress.rs > /tmp/state.diff
          cat > /tmp/questions.json <<'JSON'
          {
            "authority_widening": {"type":"boolean","instructions":"Does this exact diff create, mint, widen, or bypass authorization rather than only constrain an already-eligible Grant decision?"},
            "permissive_unknown": {"type":"boolean","instructions":"Does this exact diff allow unknown or incomplete egress class, destination, sensitivity, or other security metadata instead of failing closed?"},
            "class_substitution": {"type":"boolean","instructions":"Does this exact diff permit one egress class to substitute for another, including DIRECT_DESTINATION for EXTERNAL_MODEL or CONNECTED_ACCOUNT for EXTERNAL_TOOL?"},
            "destination_confusion": {"type":"boolean","instructions":"Does this exact diff permit mismatched host, account, or runtime destination identity to pass egress evaluation?"},
            "operation_bypass": {"type":"boolean","instructions":"Does this exact diff allow an operation different from the one explicitly authorized by the egress constraint?"},
            "sensitive_data_bypass": {"type":"boolean","instructions":"Does this exact diff allow sensitive or unknown-sensitivity egress without explicit sensitive authorization?"},
            "provider_or_io_coupling": {"type":"boolean","instructions":"Does this exact diff add provider-specific behavior, network I/O, execution side effects, or cloud fallback to the pure policy layer?"},
            "forbidden_scope_drift": {"type":"boolean","instructions":"Does this exact diff modify or semantically widen secrets, KRP, daemon/store behavior, manifests/lockfiles, ledgers, or P02 exit claims beyond SG-000029 PR-B scope?"}
          }
          JSON
          jev-cli eval --provider jev --model jev-1.13.0 --state-file /tmp/state.diff --questions-file /tmp/questions.json --full --compact > /tmp/jev.json
          cat /tmp/jev.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/jev.json','utf8'));
          const ids = [
            'authority_widening','permissive_unknown','class_substitution',
            'destination_confusion','operation_bypass','sensitive_data_bypass',
            'provider_or_io_coupling','forbidden_scope_drift'
          ];
          const answers = data.answers ?? data;
          for (const id of ids) {
            const a = answers[id];
            if (!a || typeof a.probability !== 'number') {
              console.error('JEV_RESULT_MISSING', id);
              process.exit(2);
            }
            console.log('JEV_DIMENSION', id, 'P_TRUE', a.probability);
            if (a.probability >= 0.5) {
              console.error('JEV_BLOCKING_TRUE', id, a.probability);
              process.exit(1);
            }
          }
          console.log('JEV_8_OF_8_NO');
          NODE
