name: SG24 Exact-Head Six-Job Qualification

on:
  push:
    branches:
      - probe/sg24-exact-ci-reporting

permissions:
  contents: read
  checks: write

env:
  TARGET_SHA: e23360d6b08169b505ecf5d2efcfb1452ee82e89
  BASE_SHA: 94e0691c82ad17e8639b4e19391a518014590a49

jobs:
  javascript:
    name: Qualify JavaScript / TypeScript exact target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workspace contract
        run: pnpm check:workspace
      - name: Check JavaScript and TypeScript
        run: pnpm check:js
      - name: Publish protected check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_NAME: JavaScript / TypeScript
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/check.json
          import json, os
          json.dump({
            "name": os.environ["CHECK_NAME"],
            "head_sha": os.environ["TARGET_SHA"],
            "status": "completed",
            "conclusion": "success",
            "details_url": os.environ["DETAILS_URL"],
            "output": {
              "title": "Exact-head qualification PASS",
              "summary": "Executed the repository JavaScript / TypeScript CI commands on the exact target SHA."
            }
          }, open("/dev/stdout", "w"))
          PY
          curl --fail-with-body -sS -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs"             -d @/tmp/check.json

  rust:
    name: Qualify Rust exact target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          components: clippy,rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --all-targets
      - name: Publish protected check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_NAME: Rust
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/check.json
          import json, os
          json.dump({"name":os.environ["CHECK_NAME"],"head_sha":os.environ["TARGET_SHA"],"status":"completed","conclusion":"success","details_url":os.environ["DETAILS_URL"],"output":{"title":"Exact-head qualification PASS","summary":"Executed the repository Rust CI commands on the exact target SHA."}}, open("/dev/stdout","w"))
          PY
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" -d @/tmp/check.json

  specgrain:
    name: Qualify SpecGrain exact target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify Python baseline
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"
      - name: Validate SpecGrain runner
        run: python3 -m py_compile tools/specgrain/run.py
      - name: Check pinned SpecGrain state
        run: |
          python3 tools/specgrain/run.py --show-pin
          python3 tools/specgrain/run.py check .
      - name: Publish protected check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_NAME: SpecGrain
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/check.json
          import json, os
          json.dump({"name":os.environ["CHECK_NAME"],"head_sha":os.environ["TARGET_SHA"],"status":"completed","conclusion":"success","details_url":os.environ["DETAILS_URL"],"output":{"title":"Exact-head qualification PASS","summary":"Executed the repository SpecGrain CI commands on the exact target SHA."}}, open("/dev/stdout","w"))
          PY
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" -d @/tmp/check.json

  diffcipline:
    name: Qualify Diffcipline R1 exact target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact target with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove exact target at R1
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R1
          run-verification: "true"
      - name: Publish protected check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_NAME: Diffcipline R1
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/check.json
          import json, os
          json.dump({"name":os.environ["CHECK_NAME"],"head_sha":os.environ["TARGET_SHA"],"status":"completed","conclusion":"success","details_url":os.environ["DETAILS_URL"],"output":{"title":"Exact-head qualification PASS","summary":"Executed Diffcipline R1 against the exact target SHA and canonical PR base."}}, open("/dev/stdout","w"))
          PY
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" -d @/tmp/check.json

  provenance:
    name: Qualify Provenance exact target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact target with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Python baseline
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"
      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
      - name: Compile provenance and dependency tooling
        run: python3 -m py_compile tools/provenance/validate.py tools/provenance/test_validate.py tools/provenance/validate_notices.py tools/provenance/test_validate_notices.py tools/provenance/validate_project_license.py tools/provenance/test_validate_project_license.py tools/dependencies/validate.py tools/dependencies/test_validate.py
      - name: Run provenance and dependency conformance suites
        run: python3 -m unittest tools.provenance.test_validate tools.provenance.test_validate_notices tools.provenance.test_validate_project_license tools.dependencies.test_validate -v
      - name: Validate dependency admission
        run: python3 tools/dependencies/validate.py check
      - name: Validate project license
        run: python3 tools/provenance/validate_project_license.py check
      - name: Validate third-party notice inventory
        run: python3 tools/provenance/validate_notices.py check
      - name: Validate tracked donor ledger
        run: python3 tools/provenance/validate.py check
      - name: Publish protected check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_NAME: Provenance
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/check.json
          import json, os
          json.dump({"name":os.environ["CHECK_NAME"],"head_sha":os.environ["TARGET_SHA"],"status":"completed","conclusion":"success","details_url":os.environ["DETAILS_URL"],"output":{"title":"Exact-head qualification PASS","summary":"Executed the repository Provenance CI commands on the exact target SHA."}}, open("/dev/stdout","w"))
          PY
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" -d @/tmp/check.json

  windows-kernuxd:
    name: Qualify Windows kernuxd exact target
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          components: clippy
      - name: Run Windows kernuxd Clippy
        run: cargo clippy --locked -p kernuxd -p kernux-identity -p kernux-store -p kernux-policy --all-targets -- -D warnings
      - name: Run Windows kernuxd tests
        run: cargo test --locked -p kernuxd -p kernux-identity -p kernux-store -p kernux-policy --all-targets
      - name: Publish protected check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_NAME: Windows kernuxd
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = @{
            name = $env:CHECK_NAME
            head_sha = $env:TARGET_SHA
            status = "completed"
            conclusion = "success"
            details_url = $env:DETAILS_URL
            output = @{
              title = "Exact-head qualification PASS"
              summary = "Executed the repository Windows kernuxd CI commands on the exact target SHA."
            }
          } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/check-runs" -Headers @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          } -ContentType "application/json" -Body $payload
