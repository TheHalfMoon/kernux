name: SG24 Proof Closeout Native macOS Qualification

on:
  push:
    branches:
      - probe/sg24-proof-closeout-qualification

permissions:
  contents: read

env:
  BASE_SHA: 40517b3537f84f02197fa22f0f699adc998bd6c8
  TARGET_SHA: 8c6c7d954f5faed372f558a0a968a5e54b4e7661
  RECORD_DIGEST: f6340663290f6a609777bc1c2d10269f85e5107aa5aa4f385a06ab67b41b452e

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact proof closeout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact proof-bearing closeout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          observed="$(git diff --name-only "$BASE_SHA...$TARGET_SHA")"
          expected="$(printf '%s\n' \
            ".specgrain/evidence/SG-000024/$RECORD_DIGEST.json" \
            'docs/evidence/P02-S05-T01.md')"
          test "$observed" = "$expected"
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(".specgrain/evidence/SG-000024")/(os.environ["RECORD_DIGEST"]+".json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          assert obj["record_digest"] == "sha256:"+os.environ["RECORD_DIGEST"]
          assert obj["report"]["verified"] is True
          assert obj["report"]["issues"] == []
          assert obj["report"]["implementation_revision"] == "git:40517b3537f84f02197fa22f0f699adc998bd6c8"
          assert obj["report"]["result_digest"] == "sha256:55af1e7eb8cbab392ae5fde16b76b930adb211e16cc097f142479717dfa6327f"
          assert len(obj["report"]["acceptance_checks"]) == 10
          assert len(obj["report"]["evidence_checks"]) == 14
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full repository baseline
        run: pnpm check

      - name: Prove SG-000024 canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/specgrain/run.py prove SG-000024 . --json > /tmp/prove.json
          python3 - <<'PY'
          import json, os
          p=json.load(open("/tmp/prove.json", encoding="utf-8"))
          assert p["verified"] is True
          assert p["record_count"] == 1
          assert p["latest_record_digest"] == "sha256:"+os.environ["RECORD_DIGEST"]
          PY

      - name: Prove exact closeout at Diffcipline R3
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ${{ env.BASE_SHA }}
          risk: R3
          run-verification: "true"

      - name: Install pinned Alibaba OpenCodeReview
        run: npm install --global @alibaba-group/open-code-review@1.12.7

      - name: Run OpenCodeReview Delegation Mode accounting
        shell: bash
        run: |
          set -euo pipefail
          ocr --version
          ocr delegate preview --format json --from "$BASE_SHA" --to "$TARGET_SHA"

      - name: Final exact-target cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --check "$BASE_SHA...$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
